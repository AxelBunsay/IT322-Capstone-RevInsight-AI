<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/Customer/css/userShop.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  
  <nav>
    <div class="nav-inner">
      <div class="logo-left">
        <img src="https://res.cloudinary.com/dcl8dksb0/image/upload/v1778335391/Screenshot_2026-05-09_220256_h68zbe.png" alt="logo">
        <div>
          <h2>MMPS</h2>
          <p>Customer Shop</p>
        </div>
      </div>

      <div class="nav-right">
        <div class="nav-links">
          <a href="/Customer/userShop.html" class="icon-link"><i class="bi bi-bell"></i></a>
          <a href="#" id="openCartButton" class="icon-link"><i class="bi bi-cart"></i><span id="cartBadge" class="cart-badge" hidden>0</span></a>
        </div>

        <div class="user-menu">
          <a href="#" class="user-toggle user-pill">
            <span class="user-avatar"><i class="fa fa-user"></i></span>
            <span class="user-name">axel bunsay</span>
          </a>
          <div class="user-dropdown">
            <a href="#profile">Profile</a>
            <a href="#settings">Settings</a>
            <a href="/Customer/myOrders.html">My Orders</a>
          </div>
        </div>

        <a href="#logout" class="logout-link">Logout</a>
      </div>
      <!-- center nav buttons -->
      <div class="nav-center" aria-label="primary navigation">
        <a href="/Customer/userShop.html" class="center-btn active"><i class="bi bi-shop-window-fill"></i> Shop</a>
        <a href="/Customer/services.html" class="center-btn"><i class="bi bi-tools"></i> Services</a>
        <a href="/Customer/myOrders.html" class="center-btn"><i class="bi bi-card-list"></i> My Orders</a>
      </div>
    </div>
  </nav>

  <main>

    <section class="hero-section">
      <div class="hero-content">
        <h4>MANOY'S MOTORCYCLE PARTS, ACCESSORIES & SERVICES</h4>
        <h1> Welcome, axel bunsay! 👋</h1>
        <p>Find the right parts for your ride. Quality guaranteed.</p>
        <ul class="hero-pills">
          <li><span>44 Products Available</span></li>
          <li><span>Fast Service</span></li>
          <li><span>Expert Mechanics</span></li>
        </ul>
      </div>
    </section>


    <section class="products-section">
      <div class="search-row">
        <div class="search-container">
          <i class="bi bi-search"></i>
          <input class="form-control" id="productSearch" type="text" placeholder="Search parts, accessories...">
        </div>
        <select class="filter-dropdown" id="priceFilter" name="priceFilter">
          <option value="">Default</option>
          <option value="0-500">₱0 - ₱500</option>
          <option value="500-1000">₱500 - ₱1000</option>
          <option value="1000-5000">₱1000 - ₱5000</option>
          <option value="5000+">₱5000+</option>
        </select>
      </div>

      <div class="browse-controls">
        <div class="category-pills">
          <button class="pill active" data-cat="all"><i class="bi bi-list-ul"></i> All <span class="pill-count">15</span></button>
          <button class="pill" data-cat="Brake Parts"><i class="bi bi-brake-parking-fill"></i> Brake Parts <span class="pill-count">3</span></button>
          <button class="pill" data-cat="Engine Parts"><i class="bi bi-cpu-fill"></i> Engine Parts <span class="pill-count">7</span></button>
          <button class="pill" data-cat="Accessories"><i class="bi bi-patch-check-fill"></i> Accessories <span class="pill-count">5</span></button>
        </div>
      </div>

      <div class="products" id="productsGrid">
        <!-- Product cards are rendered here by script -->
      </div>

        <div class="products-footer">
          <div class="products-info" id="productsInfo"></div>
          <div class="pagination" id="productsPagination"></div>
        </div>
    </section>

  </main>



  <script src="/Customer/script/userToggle.js"></script>
  <script src="/Customer/script/userShop.js"></script>
</body>
</html>
