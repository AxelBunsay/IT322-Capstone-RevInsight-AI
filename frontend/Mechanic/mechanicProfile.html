<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - MMPS</title>
    <link rel="stylesheet" href="css/mechanicDashboard.css">
    <style>
        .profile-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .profile-header {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            flex-shrink: 0;
        }

        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .profile-name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .profile-specialty {
            font-size: 16px;
            color: #666;
            margin-bottom: 12px;
            text-transform: capitalize;
        }

        .profile-meta {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
        }

        .profile-meta-item {
            display: flex;
            flex-direction: column;
        }

        .profile-meta-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .profile-meta-value {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .profile-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-available {
            background: #dcfce7;
            color: #166534;
        }

        .status-busy {
            background: #fef3c7;
            color: #92400e;
        }

        .status-on-leave {
            background: #fee2e2;
            color: #991b1b;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        .error {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #166534;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .profile-meta {
                justify-content: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .profile-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">🔧</div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="mechanicDashboard.html" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="mechanicJobs.html" class="nav-item">
                    <span class="nav-icon">🔨</span>
                    <span class="nav-label">Jobs</span>
                </a>
                <a href="partsLookup.html" class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">Parts</span>
                </a>
                <a href="mechanicProfile.html" class="nav-item active">
                    <span class="nav-icon">👤</span>
                    <span class="nav-label">Profile</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <span>🚪</span>
                    <span>Logout</span>
                </button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">                <button class=\"hamburger-menu\" id=\"sidebarToggle\" aria-label=\"Toggle sidebar\">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>                <div class="header-title">
                    <span class="section-label">MECHANIC PORTAL</span>
                    <h1>My Profile</h1>
                </div>
                <div class="header-info">
                    <span id="currentDate" class="date"></span>
                    <div class="user-avatar">👤</div>
                </div>
            </header>
            
            <!-- Profile Content -->
            <div class="dashboard-content">
                <div class="profile-container">
                    <div id="alertContainer"></div>

                    <!-- Profile Header -->
                    <div class="profile-header" id="profileHeader">
                        <div class="profile-loading">Loading profile...</div>
                    </div>

                    <!-- Personal Information -->
                    <div class="profile-section">
                        <h2 class="section-title">Personal Information</h2>
                        <form id="profileForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>First Name</label>
                                    <input type="text" id="firstName" required>
                                </div>
                                <div class="form-group">
                                    <label>Last Name</label>
                                    <input type="text" id="lastName" required>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" id="email" readonly style="background: #f5f5f5;">
                                </div>
                                <div class="form-group">
                                    <label>Phone Number</label>
                                    <input type="tel" id="phoneNumber" required>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Professional Information -->
                    <div class="profile-section">
                        <h2 class="section-title">Professional Information</h2>
                        <form id="professionalForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Specialization</label>
                                    <select id="specialization" required>
                                        <option value="">Select specialization</option>
                                        <option value="general">General</option>
                                        <option value="engine">Engine</option>
                                        <option value="transmission">Transmission</option>
                                        <option value="electrical">Electrical</option>
                                        <option value="suspension">Suspension</option>
                                        <option value="brakes">Brakes</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Years of Experience</label>
                                    <input type="number" id="yearsOfExperience" min="0" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Certifications</label>
                                <input type="text" id="certifications" placeholder="e.g., ASE, EPA, etc. (comma separated)">
                            </div>
                        </form>
                    </div>

                    <!-- Bio & Availability -->
                    <div class="profile-section">
                        <h2 class="section-title">Bio & Availability</h2>
                        <form id="bioForm">
                            <div class="form-group">
                                <label>Bio</label>
                                <textarea id="bio" placeholder="Tell customers about your experience and expertise..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>Availability Status</label>
                                <select id="availabilityStatus" required>
                                    <option value="available">Available</option>
                                    <option value="busy">Busy</option>
                                    <option value="on-leave">On Leave</option>
                                </select>
                            </div>
                        </form>
                    </div>

                    <!-- Statistics -->
                    <div class="profile-section">
                        <h2 class="section-title">Performance Statistics</h2>
                        <div class="profile-stats">
                            <div class="stat">
                                <div class="stat-value" id="totalRepairs">0</div>
                                <div class="stat-label">Total Repairs</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value" id="successRateDisplay">0%</div>
                                <div class="stat-label">Success Rate</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value" id="averageRatingDisplay">0</div>
                                <div class="stat-label">Average Rating</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value" id="accountStatus">Active</div>
                                <div class="stat-label">Account Status</div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="profile-section">
                        <div class="button-group">
                            <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
                            <button class="btn btn-secondary" onclick="resetForm()">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/mechanicProfile.js"></script>
</body>
</html>
